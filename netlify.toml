[build]
  # 数据库接上之前先只构建；接上后把 db push 加回这里：
  #   export DATABASE_URL="${DATABASE_URL:-$NETLIFY_DATABASE_URL}" && npx prisma db push --skip-generate
  command = "npx prisma generate && next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # 让 prisma.config.ts 选 prisma/postgres.prisma
  DATABASE_PROVIDER = "postgres"
  NEXT_TELEMETRY_DISABLED = "1"

